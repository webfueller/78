[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rehearsal"
version = "0.1.0"
description = "Let an agent rehearse, then commit — with a receipt and an undo."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
rehearsal = "rehearsal.cli:main"

[tool.setuptools]
# The engine, and only the engine. Everything built on it lives in domains/ with
# its own pyproject and depends on this one -- so `pip install rehearsal` gets a
# log, a fork, a receipt and an undo, and no opinions about mail.
packages = ["rehearsal"]
