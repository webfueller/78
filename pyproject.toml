[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight"
version = "0.2.0"
description = "Rehearse the week before you live it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
preflight = "preflight.cli:main"
workbench = "workbench.cli:main"

[tool.setuptools]
# One kernel, two domains, one direction: `preflight` and `workbench` import
# `rehearsal` and never the reverse, and they do not import each other.
# tests/test_rehearsal.py fails the build if the kernel grows a dependency on a
# domain, so lifting it into its own distribution stays a move and a five-line
# pyproject, whenever that is worth doing.
packages = ["preflight", "rehearsal", "workbench"]

[tool.setuptools.package-data]
preflight = ["web/*"]
