[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight"
version = "0.2.0"
description = "Rehearse the week before you live it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
preflight = "preflight.cli:main"

[tool.setuptools]
# Two packages, one direction: preflight imports rehearsal and never the reverse.
# `rehearsal` carries no dependency on this product -- tests/test_rehearsal.py
# fails the build if it grows one -- so lifting it into its own distribution is a
# move and a five-line pyproject, whenever that is worth doing.
packages = ["preflight", "rehearsal"]

[tool.setuptools.package-data]
preflight = ["web/*"]
