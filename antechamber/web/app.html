<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antechamber</title>
<style>
/* A committed single-theme instrument panel: amber is what is real, cyan is
   what is simulated, rust is what goes wrong. Every colour is painted
   explicitly so the page never borrows a ground it did not choose. */
:root {
  --ground:#0C1720; --panel:#12212C; --sunken:#091219;
  --rule:#21384A; --rule-soft:#1A2C3A;
  --ink:#D9E4E9; --ink-mid:#A8BCC6; --ink-dim:#7B95A3;
  --real:#E8A33D; --sim:#61B7C5; --dead:#C4614C; --good:#7FB069;
  --display:"Iowan Old Style",Charter,Georgia,serif;
  --util:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--display); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.mono,.k{font-family:var(--util)}
.k{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-dim);margin:0}
h1,h2,h3{margin:0;font-weight:400;letter-spacing:-.01em}
h1{font-size:19px}
h2{font-size:17px}
button{font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--sim);outline-offset:2px}

/* ---------- frame ---------- */
header.top{
  display:flex;flex-wrap:wrap;gap:10px 28px;align-items:baseline;
  padding:14px 22px;border-bottom:1px solid var(--rule);background:var(--panel);
}
header.top h1 span{color:var(--real)}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:1px;background:var(--rule);min-height:calc(100% - 56px)}
aside,main{background:var(--ground);padding:20px 22px;min-width:0}
aside{display:flex;flex-direction:column;gap:22px}
main{display:flex;flex-direction:column;gap:22px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}

/* ---------- lists ---------- */
.rows{display:flex;flex-direction:column;gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft)}
.row{background:var(--panel);padding:8px 10px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.row .who{color:var(--ink-mid);font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .num{font-family:var(--util);font-size:11px;color:var(--ink-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.row.warn .num{color:var(--dead)}

/* ---------- controls ---------- */
.mandate{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{
  border:1px solid var(--rule);background:var(--sunken);color:var(--ink-dim);
  padding:5px 11px;font-family:var(--util);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;
}
.chip[aria-pressed="true"]{border-color:var(--real);color:var(--real)}
.go{
  border:1px solid var(--real);background:var(--real);color:#0C1720;
  padding:7px 16px;font-family:var(--util);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
}
.go[disabled]{opacity:.5;cursor:progress}
.ghost{border:1px solid var(--rule);background:transparent;color:var(--ink-mid);
  padding:6px 13px;font-family:var(--util);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.ghost:hover{border-color:var(--sim);color:var(--sim)}

/* ---------- map ---------- */
.map{border:1px solid var(--rule);background:var(--panel);padding:14px 14px 10px}
.map-scroll{overflow-x:auto}
svg{display:block;width:100%;min-width:660px;height:auto}
.sl{font-family:var(--util);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.edge{fill:none;stroke-linecap:round;transition:opacity .15s}
.edge.dim{opacity:.25}
.endpoint{cursor:pointer}
.endpoint rect{fill:transparent}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;border-top:1px solid var(--rule-soft);margin-top:10px;padding-top:9px}
.key{display:inline-flex;align-items:center;gap:7px;font-family:var(--util);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.key::before{content:"";width:16px;height:2px;background:currentColor}
.key.r{color:var(--real)}.key.s{color:var(--sim)}.key.d{color:var(--dead)}

/* ---------- plan table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
th,td{text-align:right;padding:8px 12px;border-bottom:1px solid var(--rule-soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-family:var(--util);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-dim);background:var(--sunken);border-bottom-color:var(--rule)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunken)}
tbody tr[aria-selected="true"]{background:var(--sunken)}
tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--real)}
td.n{font-family:var(--util);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-mid)}
td.pick{color:var(--real)}
.tag{font-family:var(--util);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--real);color:var(--real);padding:1px 5px;margin-left:8px}

/* ---------- detail ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.card{border:1px solid var(--rule);background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.tl{display:flex;flex-direction:column;gap:9px;max-height:340px;overflow-y:auto}
.ev{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:baseline;
  border-left:2px solid var(--real);padding-left:11px}
.ev.simulated{border-left-color:var(--sim)}
.ev time{font-family:var(--util);font-size:10px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.ev p{margin:0;font-size:13.5px;color:var(--ink-mid)}
.ev .who{color:var(--ink);font-size:13px}
.ev.simulated .who{color:var(--sim)}
.stamp{font-family:var(--util);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sim)}
.receipt{font-family:var(--util);font-size:11px;color:var(--ink-dim);word-break:break-all}
.receipt b{color:var(--ink-mid);font-weight:400}
.err{color:var(--dead);font-family:var(--util);font-size:12px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 96px 40px;gap:12px;align-items:center;font-size:12.5px}
.bar .t{color:var(--ink-mid);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{display:block;height:6px;background:var(--sunken);border:1px solid var(--rule-soft)}
.bar .fill{display:block;height:100%;background:var(--sim)}
.bar .v{font-family:var(--util);font-size:11px;color:var(--ink-mid);text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--ink-dim);font-size:13.5px}
</style>
</head>
<body>

<header class="top">
  <h1>Ante<span>chamber</span></h1>
  <p class="k" id="clock">—</p>
  <p class="k" id="burn">—</p>
  <p class="k" id="calib">—</p>
</header>

<div class="grid">
  <aside>
    <div>
      <p class="k">Waiting on someone</p>
      <div class="rows" id="threads"></div>
    </div>
    <div>
      <p class="k">Next up</p>
      <div class="rows" id="meetings"></div>
    </div>
    <div>
      <p class="k">Standing charges</p>
      <div class="rows" id="subs"></div>
    </div>
  </aside>

  <main>
    <section class="card">
      <p class="k">The mandate</p>
      <div class="mandate">
        <button class="chip" data-m="chase"  aria-pressed="true">Chase what's gone quiet</button>
        <button class="chip" data-m="prune"  aria-pressed="true">Cut what I don't use</button>
        <button class="chip" data-m="defend" aria-pressed="true">Defend the calendar</button>
        <button class="go" id="run">Rehearse the week</button>
        <span class="k" id="runstate"></span>
      </div>
    </section>

    <section class="map" id="mapcard" hidden>
      <div class="map-scroll"><svg id="map" role="img" aria-label="Branch map of rehearsed futures"></svg></div>
      <div class="legend">
        <span class="key r">Recommended</span>
        <span class="key s">Simulated future</span>
        <span class="key d">Late surprise</span>
        <span class="key" id="coverage"></span>
      </div>
    </section>

    <section id="planscard" hidden>
      <p class="k" style="margin-bottom:8px">Plans, scored</p>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th>Plan</th><th>Actions</th><th>E[replies]</th><th>E[late]</th>
            <th>Saved /mo</th><th>Score</th>
          </tr></thead>
          <tbody id="plans"></tbody>
        </table>
      </div>
      <p class="k" id="weights" style="margin-top:8px"></p>
    </section>

    <section class="split" id="detail" hidden>
      <div class="card">
        <p class="k">This future, hour by hour</p>
        <h2 id="futuretitle">—</h2>
        <div class="tl" id="timeline"></div>
      </div>
      <div class="card">
        <p class="k">Commit</p>
        <p class="empty" id="committext">Pick a future on the map.</p>
        <div class="mandate">
          <button class="go" id="commit" hidden>Commit this future</button>
          <button class="ghost" id="undo" hidden>Undo</button>
        </div>
        <div class="receipt" id="receipt"></div>
        <div class="err" id="error"></div>
        <div>
          <p class="k" style="margin-bottom:7px">What the plan is claiming</p>
          <div class="bars" id="claims"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const api = async (path, body) => {
  const r = await fetch(path, body ? {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
  } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
};
const money = c => (c/100).toLocaleString(undefined,{style:"currency",currency:"EUR"});
const day = ts => new Date(ts*1000).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const hour = ts => new Date(ts*1000).toLocaleString(undefined,{weekday:"short",hour:"2-digit",minute:"2-digit"});
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let MAP = null, SELECTED = null, DETAIL = null, LAST_COMMIT = null;

/* ------------------------------------------------------------------ the world */

async function loadWorld() {
  const w = await api("/api/world");
  $("#clock").textContent = "World clock · " + day(w.summary.clock);
  $("#burn").textContent = w.summary.active_subscriptions + " subscriptions · " +
                           money(w.summary.monthly_burn_cents) + "/mo";

  $("#threads").innerHTML = w.threads.map(t => `
    <div class="row ${t.waiting_days > 7 ? "warn":""}">
      <span class="who">${esc(t.name)} — ${esc(t.subject)}</span>
      <span class="num">${t.waiting_days}d</span>
    </div>`).join("") || `<div class="row"><span class="who">Nothing outstanding.</span></div>`;

  $("#meetings").innerHTML = w.meetings.map(m => `
    <div class="row ${m.moves ? "warn":""}">
      <span class="who">${esc(m.title)}</span>
      <span class="num">${m.in_days}d${m.moves ? " · moved "+m.moves : ""}</span>
    </div>`).join("") || `<div class="row"><span class="who">Clear.</span></div>`;

  $("#subs").innerHTML = w.subscriptions.map(s => `
    <div class="row">
      <span class="who" style="${s.state!=="active"?"text-decoration:line-through;opacity:.55":""}">${esc(s.merchant)}</span>
      <span class="num">${money(s.amount_cents)}</span>
    </div>`).join("");
}

async function loadScore() {
  try {
    const s = await api("/api/score");
    const o = s.overall;
    $("#calib").textContent = o.n
      ? `Scoreboard · ${o.n} claims settled · Brier ${o.brier} vs ${o.baseline_brier} baseline · ${o.verdict}`
      : `Scoreboard · ${s.open_claims} claims open, none settled yet`;
  } catch (e) { $("#calib").textContent = "Scoreboard unavailable"; }
}

/* ------------------------------------------------------------- the branch map */

function drawMap(map) {
  const plans = map.plans, W = 1000, PAD = 46;
  const rows = plans.reduce((n,p) => n + Math.max(1, p.branches.length), 0);
  const H = Math.max(240, rows * 30 + plans.length * 16 + 46);
  const svg = $("#map");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const xRoot = 34, xPlan = 300, xEnd = W - 210;
  let y = 40, parts = [], planY = [];

  // day rules
  for (let d = 0; d <= map.horizon_days; d++) {
    const x = xPlan + (xEnd - xPlan) * (d / map.horizon_days);
    parts.push(`<line x1="${x}" y1="26" x2="${x}" y2="${H-10}" stroke="var(--rule-soft)" stroke-width="1"/>`);
    if (d % 2 === 0) parts.push(`<text class="sl" x="${x}" y="18" fill="var(--ink-dim)">Day ${d}</text>`);
  }

  plans.forEach((p, i) => {
    const n = Math.max(1, p.branches.length);
    const band = n * 30;
    planY.push(y + band/2 - 15);
    y += band + 16;
  });
  const yRoot = H/2;

  plans.forEach((p, i) => {
    const rec = p.id === map.recommended;
    const col = rec ? "var(--real)" : "var(--sim)";
    const py = planY[i];
    parts.push(`<path class="edge p${i}" d="M${xRoot},${yRoot} C${(xRoot+xPlan)/2},${yRoot} ${(xRoot+xPlan)/2},${py} ${xPlan},${py}"
                 stroke="${col}" stroke-width="${rec?2.6:1.6}"/>`);
    parts.push(`<text class="sl" x="${xPlan-8}" y="${py-7}" text-anchor="end" fill="${col}">${esc(p.name)}</text>`);

    let by = py - (p.branches.length-1)*15;
    p.branches.forEach((b, j) => {
      const late = b.metrics.late_surprises > 0;
      const ec = late ? "var(--dead)" : col;
      parts.push(`<path class="edge p${i} b${i}-${j}" d="M${xPlan},${py} C${(xPlan+xEnd)/2},${py} ${(xPlan+xEnd)/2},${by} ${xEnd},${by}"
                   stroke="${ec}" stroke-width="${(0.8 + 5*b.p).toFixed(2)}" opacity="${(0.35+0.65*b.p).toFixed(2)}"/>`);
      parts.push(`<circle cx="${xEnd}" cy="${by}" r="${rec?4.5:3.5}" fill="${ec}"/>`);
      const label = `${b.metrics.replies} reply · ${b.metrics.late_surprises} late · ${Math.round(b.p*100)}%`;
      parts.push(`<g class="endpoint" data-plan="${i}" data-branch="${j}" tabindex="0" role="button"
                    aria-label="${esc(p.name)}: ${label}">
                   <rect x="${xEnd}" y="${by-11}" width="200" height="22"/>
                   <text class="sl" x="${xEnd+10}" y="${by+3.5}" fill="${late?"var(--dead)":"var(--ink-mid)"}">${label}</text>
                  </g>`);
      by += 30;
    });
  });

  parts.push(`<circle cx="${xRoot}" cy="${yRoot}" r="5" fill="var(--real)"/>`);
  parts.push(`<text class="sl" x="${xRoot}" y="${yRoot-13}" fill="var(--real)">Now</text>`);
  svg.innerHTML = parts.join("");

  svg.querySelectorAll(".endpoint").forEach(g => {
    const pick = () => selectFuture(+g.dataset.plan, +g.dataset.branch);
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); }});
    g.addEventListener("mouseenter", () => highlight(+g.dataset.plan, +g.dataset.branch));
    g.addEventListener("mouseleave", () => highlight(null));
  });

  const cov = plans.map(p => p.coverage).reduce((a,b)=>Math.min(a,b), 1);
  $("#coverage").textContent = `These futures cover ${Math.round(cov*100)}%+ of the probability`;
  $("#coverage").style.color = "var(--ink-dim)";
}

function highlight(pi, bj) {
  $("#map").querySelectorAll(".edge").forEach(e => {
    if (pi === null) { e.classList.remove("dim"); return; }
    const keep = e.classList.contains(`p${pi}`) &&
                 (bj === undefined || !/b\d+-\d+/.test(e.className.baseVal) || e.classList.contains(`b${pi}-${bj}`));
    e.classList.toggle("dim", !keep);
  });
}

/* ---------------------------------------------------------------- plan table */

function drawPlans(map) {
  $("#plans").innerHTML = map.plans.map((p,i) => {
    const e = p.expected, rec = p.id === map.recommended;
    return `<tr data-plan="${i}" aria-selected="${rec}">
      <td class="${rec?"pick":""}">${esc(p.name)}${rec?'<span class="tag">Recommended</span>':""}
        <div style="color:var(--ink-dim);font-size:12.5px">${esc(p.rationale)}</div></td>
      <td class="n">${p.actions.length}</td>
      <td class="n">${e.replies.toFixed(2)}</td>
      <td class="n" style="${e.late_surprises>0.8?"color:var(--dead)":""}">${e.late_surprises.toFixed(2)}</td>
      <td class="n">${e.burn_saved_cents ? money(e.burn_saved_cents) : "—"}</td>
      <td class="n" style="${rec?"color:var(--real)":""}">${p.utility>0?"+":""}${p.utility.toFixed(2)}</td>
    </tr>`;
  }).join("");
  $("#plans").querySelectorAll("tr").forEach(tr =>
    tr.addEventListener("click", () => selectFuture(+tr.dataset.plan, 0)));
  const w = map.weights;
  $("#weights").textContent =
    `Score = ${w.reply}×replies ${w.per_action}×actions +${w.burn_saved_per_1000c}×(saved/1000c) ` +
    `${w.late_surprise}×late surprises — placeholder weights, shown because they are a guess`;
}

/* ------------------------------------------------------------------ a future */

async function selectFuture(pi, bj) {
  const p = MAP.plans[pi], b = p.branches[bj];
  SELECTED = { plan:p, branch:b };
  LAST_COMMIT = null;
  $("#detail").hidden = false;
  $("#receipt").textContent = ""; $("#error").textContent = "";
  $("#undo").hidden = true;
  $("#plans").querySelectorAll("tr").forEach(tr =>
    tr.setAttribute("aria-selected", +tr.dataset.plan === pi));

  $("#futuretitle").textContent =
    `${p.name} — ${b.metrics.replies} reply, ${b.metrics.late_surprises} late surprise` +
    `${b.metrics.late_surprises===1?"":"s"} (${Math.round(b.p*100)}% likely)`;

  $("#claims").innerHTML = p.uncertain.length ? p.uncertain.map(u => `
    <div class="bar" title="${esc(u.describe)}">
      <span class="t">${esc(u.describe)}</span>
      <span class="track"><span class="fill" style="width:${Math.round(u.p*100)}%"></span></span>
      <span class="v">${Math.round(u.p*100)}%</span>
    </div>`).join("") : `<p class="empty">This plan claims nothing — it does nothing.</p>`;

  const detail = DETAIL = await api("/api/branch?branch=" + encodeURIComponent(b.id));
  $("#timeline").innerHTML = detail.timeline.length ? detail.timeline.map(e => `
    <div class="ev ${e.simulated?"simulated":""}">
      <time>${hour(e.ts)}</time>
      <div>
        <div class="who">${esc(label(e))}</div>
        ${e.simulated ? `<span class="stamp">Simulated · stays in this fork</span>` : ""}
        ${e.body && !e.simulated ? `<p>${esc(e.body)}</p>` : ""}
        ${e.reason ? `<p>${esc(e.reason)}</p>` : ""}
      </div>
    </div>`).join("") : `<p class="empty">Nothing happens. That is the plan.</p>`;

  $("#committext").textContent = detail.committable
    ? `${detail.committable} action${detail.committable===1?"":"s"} would run for real. The simulated replies stay here — they cannot be promoted.`
    : "This plan proposes no actions, so there is nothing to commit.";
  $("#commit").hidden = !detail.committable;
}

function label(e) {
  if (e.kind === "message.sent")       return "You send — " + (e.subject || e.entity);
  if (e.kind === "message.received")   return "A reply lands — " + e.entity;
  if (e.kind === "calendar.moved")     return "The meeting moves — " + e.entity;
  if (e.kind === "money.cancelled")    return "Subscription cancelled — " + (e.merchant || e.entity);
  return e.kind + " — " + e.entity;
}

/* -------------------------------------------------------------------- actions */

$("#run").addEventListener("click", async () => {
  const mandate = [...document.querySelectorAll(".chip")]
    .filter(c => c.getAttribute("aria-pressed") === "true").map(c => c.dataset.m);
  $("#run").disabled = true; $("#runstate").textContent = "Running the week…";
  try {
    MAP = await api("/api/rehearse", { mandate, horizon_days: 7 });
    $("#mapcard").hidden = false; $("#planscard").hidden = false;
    drawMap(MAP); drawPlans(MAP);
    const ri = MAP.plans.findIndex(p => p.id === MAP.recommended);
    await selectFuture(ri < 0 ? 0 : ri, 0);
    $("#runstate").textContent = `${MAP.plans.length} plans · rehearsal ${MAP.rehearsal}`;
    loadScore();
  } catch (e) {
    $("#runstate").textContent = ""; $("#error").textContent = e.message;
  } finally { $("#run").disabled = false; }
});

document.querySelectorAll(".chip").forEach(c =>
  c.addEventListener("click", () =>
    c.setAttribute("aria-pressed", c.getAttribute("aria-pressed") === "true" ? "false" : "true")));

$("#commit").addEventListener("click", async () => {
  $("#error").textContent = "";
  try {
    const r = await api("/api/commit", { branch: SELECTED.branch.id });
    LAST_COMMIT = r.commit_id;
    // The honest comparison: the rehearsal minus its simulated replies.
    const matches = r.state_after === DETAIL.state_hash_real;
    $("#receipt").innerHTML = `
      <b>Commit</b> ${r.commit_id} · ${r.actions} actions<br>
      <b>Before</b> ${r.state_before.slice(0,24)}…<br>
      <b>After</b> ${r.state_after.slice(0,24)}…<br>
      <b>Rehearsed</b> ${matches
        ? "matches — every real action landed exactly as previewed"
        : "DIFFERS from the rehearsal — investigate before trusting this"}<br>
      <b>Undo until</b> ${hour(r.undo_until)}`;
    $("#commit").hidden = true; $("#undo").hidden = false;
    loadWorld();
  } catch (e) { $("#error").textContent = e.message; }
});

$("#undo").addEventListener("click", async () => {
  $("#error").textContent = "";
  try {
    const r = await api("/api/undo", { commit_id: LAST_COMMIT });
    $("#receipt").innerHTML += `<br><b>Undone</b> ${r.restored ? "world restored exactly" : "state differs"}`;
    $("#undo").hidden = true;
    loadWorld();
  } catch (e) { $("#error").textContent = e.message; }
});

loadWorld(); loadScore();
</script>
</body>
</html>
